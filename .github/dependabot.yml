version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native) lacks the JS API that `next build` type-checking uses.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep Node types on the runtime major used in CI / engines (Node 22).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
